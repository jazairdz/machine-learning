<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>App 20 — Crystal Structure Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#fff;--surface:#f7f6f2;--border:#e0ddd6;--accent:#1a5276;--accent2:#0f6e56;--warn:#854f0b;--text:#0d0d0d;--muted:#444;--code-bg:#f0ede4;--tag-bg:#d4e6f1;--coral:#993c1d;--purple:#6c3483;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.6;padding:20px 14px 60px;}
  .wrap{max-width:1080px;margin:0 auto;}
  h1{font-family:'Playfair Display',serif;font-size:clamp(20px,3.5vw,28px);margin-bottom:4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}

  .tabs{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-wrap:wrap;}
  .tab{flex:1;min-width:100px;padding:11px 8px;text-align:center;cursor:pointer;background:var(--surface);font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);border-right:1px solid var(--border);transition:all .15s;}
  .tab:last-child{border-right:none;}
  .tab:hover{background:var(--tag-bg);}
  .tab.active{background:var(--accent);color:#fff;font-weight:600;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:820px){.grid2{grid-template-columns:1fr;}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .panel h2{font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:10px;font-weight:600;}

  svg{width:100%;height:320px;background:#fff;border:1px solid var(--border);border-radius:8px;display:block;}

  .slider-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .slider-row label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);min-width:80px;}
  .slider-row input[type=range]{flex:1;accent-color:var(--accent);}
  .slider-row .val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);font-weight:600;min-width:40px;text-align:right;}

  .info-row{display:flex;justify-content:space-between;font-size:13px;margin:6px 0;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .info-row:last-child{border-bottom:none;}
  .info-row .il{color:var(--muted);}
  .info-row .iv{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--text);}

  .bonding-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;font-family:'IBM Plex Mono',monospace;margin-bottom:10px;}
  .bonding-badge.covalent{background:#d4e6f1;color:var(--accent);}
  .bonding-badge.ionic{background:#faece7;color:var(--coral);}
  .bonding-badge.mixed{background:#f0e8f5;color:var(--purple);}
  .bonding-badge.metallic{background:#faeeda;color:var(--warn);}

  canvas#eosCanvas{width:100%;height:200px;background:#fff;border:1px solid var(--border);border-radius:8px;display:block;}

  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
</style>
</head>
<body>
<div class="wrap">
  <h1>App 20 — Crystal Structure Explorer</h1>
  <p class="sub">Four bonding types, one workflow — rotate each structure, scan its equation of state, and check the result against experiment</p>

  <div class="tabs" id="tabs"></div>

  <div class="grid2">
    <div class="panel">
      <h2 id="structTitle">Structure</h2>
      <svg id="structSvg" viewBox="0 0 320 280"></svg>
      <div class="slider-row">
        <label>Rotate Y</label>
        <input type="range" id="rotSlider" min="0" max="360" value="25" step="1">
        <span class="val" id="rotVal">25°</span>
      </div>
      <div class="legend" id="structLegend"></div>
    </div>

    <div class="panel">
      <h2>Properties &amp; validation</h2>
      <div id="bondingBadge"></div>
      <div id="infoRows"></div>
      <h2 style="margin-top:16px">Equation of state — E vs V</h2>
      <canvas id="eosCanvas" width="400" height="200"></canvas>
      <div class="legend">
        <span><span class="dot" style="background:#1a5276"></span>Computed curve</span>
        <span><span class="dot" style="background:#993c1d"></span>Equilibrium volume V₀</span>
      </div>
    </div>
  </div>
</div>

<script>
var SYSTEMS = {
  Si: {
    name: 'Silicon', formula: 'Si', structure: 'Diamond cubic', bonding: 'covalent',
    a: 5.43, B0: 97.9, B0ref: '97.9 GPa (experiment)',
    extra: [{l:'Phonon (Raman)', v:'520 cm⁻¹'}, {l:'Vacancy E_f', v:'~3.5–4.0 eV'}],
    atoms: [
      {x:0,y:0,z:0,c:'#1a5276'}, {x:1,y:1,z:0,c:'#1a5276'}, {x:1,y:0,z:1,c:'#1a5276'}, {x:0,y:1,z:1,c:'#1a5276'},
      {x:0.5,y:0.5,z:0.5,c:'#0f6e56'}, {x:1.5,y:1.5,z:0.5,c:'#0f6e56'}, {x:1.5,y:0.5,z:1.5,c:'#0f6e56'}, {x:0.5,y:1.5,z:1.5,c:'#0f6e56'},
    ],
    bonds: [[0,4],[1,4],[2,4],[3,4]],
    legend: [['#1a5276','Si (fcc sites)'],['#0f6e56','Si (tetrahedral)']],
  },
  NaCl: {
    name: 'Sodium chloride', formula: 'NaCl', structure: 'Rock-salt', bonding: 'ionic',
    a: 5.64, B0: 24.0, B0ref: '24.0 GPa (experiment)',
    extra: [{l:'Surface E (100)', v:'~0.15–0.20 J/m²'}, {l:'Bonding character', v:'Strongly ionic'}],
    atoms: [
      {x:0,y:0,z:0,c:'#854f0b'}, {x:1,y:0,z:0,c:'#0f6e56'}, {x:0,y:1,z:0,c:'#0f6e56'}, {x:0,y:0,z:1,c:'#0f6e56'},
      {x:1,y:1,z:0,c:'#854f0b'}, {x:1,y:0,z:1,c:'#854f0b'}, {x:0,y:1,z:1,c:'#854f0b'}, {x:1,y:1,z:1,c:'#0f6e56'},
    ],
    bonds: [[0,1],[0,2],[0,3],[7,4],[7,5],[7,6]],
    legend: [['#854f0b','Na⁺'],['#0f6e56','Cl⁻']],
  },
  TiO2: {
    name: 'Titanium dioxide', formula: 'TiO₂', structure: 'Rutile (tetragonal)', bonding: 'mixed',
    a: 4.59, c: 2.96, B0: 210, B0ref: '~210 GPa (DFT range)',
    extra: [{l:'Eg phonon mode', v:'≈447 cm⁻¹'}, {l:'O vacancy E_f', v:'~4–5 eV (DFT+U)'}],
    atoms: [
      {x:0,y:0,z:0,c:'#993c1d'}, {x:1,y:1,z:0.5,c:'#993c1d'},
      {x:0.3,y:0.3,z:0,c:'#1a5276'}, {x:0.7,y:0.7,z:0,c:'#1a5276'},
      {x:0.8,y:0.2,z:0.5,c:'#1a5276'}, {x:0.2,y:0.8,z:0.5,c:'#1a5276'},
    ],
    bonds: [[0,2],[0,3],[1,4],[1,5]],
    legend: [['#993c1d','Ti'],['#1a5276','O']],
  },
  Cu: {
    name: 'Copper', formula: 'Cu', structure: 'FCC', bonding: 'metallic',
    a: 3.61, B0: 140, B0ref: '140 GPa (experiment)',
    extra: [{l:'Stacking fault E', v:'~40–45 mJ/m²'}, {l:'Surface E (111)', v:'~1.95 J/m²'}],
    atoms: [
      {x:0,y:0,z:0,c:'#854f0b'}, {x:1,y:1,z:0,c:'#854f0b'}, {x:1,y:0,z:1,c:'#854f0b'}, {x:0,y:1,z:1,c:'#854f0b'},
      {x:0.5,y:0.5,z:0,c:'#d99b3f'}, {x:0.5,y:0,z:0.5,c:'#d99b3f'}, {x:0,y:0.5,z:0.5,c:'#d99b3f'},
      {x:0.5,y:0.5,z:1,c:'#d99b3f'}, {x:0.5,y:1,z:0.5,c:'#d99b3f'}, {x:1,y:0.5,z:0.5,c:'#d99b3f'},
    ],
    bonds: [[0,4],[0,5],[0,6],[1,4],[2,5],[3,6]],
    legend: [['#854f0b','Cu (corner)'],['#d99b3f','Cu (face)']],
  },
};

var order = ['Si','NaCl','TiO2','Cu'];
var labels = {Si:'Silicon', NaCl:'NaCl', TiO2:'TiO₂', Cu:'Copper'};
var active = 'Si';
var rotY = 25;

function renderTabs(){
  var tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  order.forEach(function(key){
    var div = document.createElement('div');
    div.className = 'tab' + (key===active ? ' active' : '');
    div.textContent = labels[key];
    div.addEventListener('click', function(){ active = key; render(); });
    tabs.appendChild(div);
  });
}

function project(x,y,z,angY){
  var rad = angY * Math.PI / 180;
  var x2 = x*Math.cos(rad) + z*Math.sin(rad);
  var z2 = -x*Math.sin(rad) + z*Math.cos(rad);
  var scale = 70;
  var px = 160 + x2*scale - y*scale*0.35;
  var py = 160 - y*scale*0.55 - z2*scale*0.35 + 40;
  var depth = z2 + y*0.5;
  return {x:px, y:py, depth:depth};
}

function renderStructure(){
  var sys = SYSTEMS[active];
  document.getElementById('structTitle').textContent = sys.name + ' (' + sys.formula + ') — ' + sys.structure;

  var projected = sys.atoms.map(function(a){
    var p = project(a.x-0.5, a.y-0.5, a.z-0.5, rotY);
    return {x:p.x, y:p.y, depth:p.depth, c:a.c};
  });

  var parts = [];
  sys.bonds.forEach(function(b){
    var a1 = projected[b[0]], a2 = projected[b[1]];
    parts.push('<line x1="'+a1.x+'" y1="'+a1.y+'" x2="'+a2.x+'" y2="'+a2.y+'" stroke="#cfcac0" stroke-width="2"></line>');
  });

  var order2 = projected.map(function(p,i){ return {p:p, i:i}; }).sort(function(a,b){ return a.p.depth - b.p.depth; });
  order2.forEach(function(o){
    var p = o.p;
    var r = 13 + p.depth*1.5;
    if(r < 6) r = 6;
    parts.push('<circle cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" fill="'+p.c+'"></circle>');
  });

  document.getElementById('structSvg').innerHTML = parts.join('');

  var legendDiv = document.getElementById('structLegend');
  legendDiv.innerHTML = sys.legend.map(function(l){
    return '<span><span class="dot" style="background:'+l[0]+'"></span>'+l[1]+'</span>';
  }).join('');
}

function renderInfo(){
  var sys = SYSTEMS[active];
  var badgeDiv = document.getElementById('bondingBadge');
  var bondLabels = {covalent:'Covalent bonding', ionic:'Ionic bonding', mixed:'Mixed ionic/covalent', metallic:'Metallic bonding'};
  badgeDiv.innerHTML = '<span class="bonding-badge '+sys.bonding+'">'+bondLabels[sys.bonding]+'</span>';

  var rows = '<div class="info-row"><span class="il">Lattice a</span><span class="iv">'+sys.a.toFixed(2)+' Å</span></div>';
  if(sys.c) rows += '<div class="info-row"><span class="il">Lattice c</span><span class="iv">'+sys.c.toFixed(2)+' Å</span></div>';
  rows += '<div class="info-row"><span class="il">Bulk modulus B₀</span><span class="iv">'+sys.B0.toFixed(1)+' GPa</span></div>';
  rows += '<div class="info-row"><span class="il">Reference</span><span class="iv">'+sys.B0ref+'</span></div>';
  sys.extra.forEach(function(e){
    rows += '<div class="info-row"><span class="il">'+e.l+'</span><span class="iv">'+e.v+'</span></div>';
  });
  document.getElementById('infoRows').innerHTML = rows;
}

function birchMurnaghan(V, V0, B0, Bp){
  var x = Math.pow(V0/V, 2/3);
  var E0 = 0;
  return E0 + (9*V0*B0/16) * ( Math.pow(x-1,3)*Bp + Math.pow(x-1,2)*(6-4*x) );
}

function renderEOS(){
  var sys = SYSTEMS[active];
  var canvas = document.getElementById('eosCanvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height, pad = 36;
  ctx.clearRect(0,0,W,H);

  var V0 = Math.pow(sys.a, 3);
  var B0_eVA3 = sys.B0 * 0.00624151;
  var Bp = 4.0;

  var Vs = [], Es = [];
  for(var f=0.85; f<=1.15; f+=0.02){
    var V = V0*f;
    Vs.push(V);
    Es.push(birchMurnaghan(V, V0, B0_eVA3, Bp));
  }
  var minE = Math.min.apply(null, Es), maxE = Math.max.apply(null, Es);
  var minV = Math.min.apply(null, Vs), maxV = Math.max.apply(null, Vs);

  ctx.strokeStyle = '#e0ddd6'; ctx.lineWidth = 1;
  ctx.strokeRect(pad, pad, W-2*pad, H-2*pad);
  ctx.fillStyle = '#888'; ctx.font = '9px IBM Plex Mono';
  ctx.fillText('Volume (Å³) →', W/2-35, H-6);
  ctx.save(); ctx.translate(10, H/2+20); ctx.rotate(-Math.PI/2); ctx.fillText('E (eV) →', 0, 0); ctx.restore();

  function toX(v){ return pad + (v-minV)/(maxV-minV) * (W-2*pad); }
  function toY(e){ return H-pad - (e-minE)/(maxE-minE+1e-9) * (H-2*pad); }

  ctx.strokeStyle = '#1a5276'; ctx.lineWidth = 2.5; ctx.beginPath();
  Vs.forEach(function(v,i){
    var px = toX(v), py = toY(Es[i]);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.stroke();

  var v0x = toX(V0), v0y = toY(0);
  ctx.beginPath(); ctx.arc(v0x, v0y, 5, 0, 2*Math.PI);
  ctx.fillStyle = '#993c1d'; ctx.fill();
  ctx.strokeStyle = '#993c1d'; ctx.setLineDash([3,3]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(v0x, pad); ctx.lineTo(v0x, H-pad); ctx.stroke();
  ctx.setLineDash([]);
}

function render(){
  renderTabs();
  renderStructure();
  renderInfo();
  renderEOS();
}

document.getElementById('rotSlider').addEventListener('input', function(){
  rotY = parseFloat(this.value);
  document.getElementById('rotVal').textContent = Math.round(rotY) + '°';
  renderStructure();
});

render();
</script>
</body>
</html>
